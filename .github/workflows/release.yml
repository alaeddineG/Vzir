name: Release

# A version tag publishes to nuget.org, where a version can be unlisted but never deleted.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check the tag matches the version
        run: test "v$(dotnet msbuild src/Wkeel -getProperty:Version)" = "$GITHUB_REF_NAME"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - run: dotnet pack --no-build --configuration Release --output artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts
      # Pinned to a commit: this step runs with the permissions above.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # Pushes the matching .snupkg too. --skip-duplicate makes a re-run safe after a partial failure.
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
