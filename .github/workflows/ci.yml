name: CI

# Scoped to code and build inputs, so documentation changes skip CI.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - samples/**
      - benchmarks/**
      - "*.slnx"
      - Directory.*
      - global.json
      - .editorconfig
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - samples/**
      - benchmarks/**
      - "*.slnx"
      - Directory.*
      - global.json
      - .editorconfig
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - run: dotnet run --no-build --configuration Release --project samples/Wkeel.Samples.Pipeline
