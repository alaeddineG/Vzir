version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-extensions:
        patterns:
          - Microsoft.Extensions.*
    ignore:
      # Held at the floor the Wkeel package declares. Raise it only when Wkeel needs a newer API.
      - dependency-name: Microsoft.Extensions.DependencyInjection.Abstractions
